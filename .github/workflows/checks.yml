# The gateway's checks, without a lab: its tests (sessions, publication, the firewall in
# disposable namespaces where the runner allows them, the proxy) and the portal's browser
# test. The site and the documentation check: pages.yml.
name: checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q aiohttp pytest
      - name: Shell syntax
        run: bash -n gateway/install-host.sh
      - name: Tests
        run: python -m pytest -q tests/test_remote_access.py
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Browser test of the portal
        run: |
          npm install --no-save playwright-core
          npx playwright-core install --with-deps chromium
          node tests/remote-access-browser-test.js
